openapi: 3.1.0
info:
  title: Ryvra Pay API
  version: 1.0.0
  summary: Canonical HTTP contract for Ryvra Pay
  description: |
    Canonical API contract published from `ryvra-protocol/pay` for cross-repo integration parity.

    Versioning strategy:
    - `info.version` uses semantic versioning.
    - Runtime default API version is configured by `PAY_API_VERSION`.
    - Clients may request an explicit version using `x-pay-api-version`.

    Compatibility and deprecation policy:
    - Additive, backward-compatible changes are allowed within the same major version.
    - Breaking changes require a major version bump and a minimum 180-day migration window.
    - Deprecated fields/endpoints are announced in the contract changelog and kept during the migration window.

    Contract changelog location: `/docs/api-contract-changelog.md`.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: invoices
  - name: payouts
  - name: reconciliation
  - name: overview
  - name: intents
x-pay-versioning-policy:
  env_var: PAY_API_VERSION
  request_header: x-pay-api-version
  semver_policy: semver
  minimum_breaking_change_migration_window_days: 180
  changelog_path: /docs/api-contract-changelog.md
paths:
  /pay/invoices:
    get:
      tags: [invoices]
      summary: List invoices
      description: Returns invoices with canonical pagination, filter, and sort behavior.
      operationId: listInvoices
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/CreatedAtSortField'
        - $ref: '#/components/parameters/PaymentStateFilter'
        - $ref: '#/components/parameters/PaymentKindFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
      responses:
        '200':
          description: Invoice collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListResponse'
              examples:
                default:
                  value:
                    data:
                      - invoice_id: inv_10231
                        reference_id: ref_pay_991
                        sourceAccountId: acct_customer_1
                        destinationAccountId: acct_merchant_8
                        amount: '250.00'
                        asset:
                          chain: eip155:1
                          asset: usd_stable
                          decimals: 2
                        assetId: usd_stable
                        state: settled
                        reason_code: PAYMENT_COLLECTION_OK
                        created_at: '2026-08-07T12:00:00.000Z'
                        metadata:
                          order_id: ord_778
                    pagination:
                      page: 1
                      page_size: 50
                      total_items: 1
                      total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/invoices/summary:
    get:
      tags: [invoices]
      summary: Get invoice summary
      operationId: getInvoiceSummary
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/PaymentStateFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
      responses:
        '200':
          description: Invoice summary projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummary'
              examples:
                default:
                  value:
                    as_of: '2026-08-07T12:00:00.000Z'
                    total_count: 124
                    total_amount: '18203.15'
                    by_state:
                      created: 8
                      authorized: 4
                      executing: 3
                      settled: 105
                      failed: 4
                      reversed: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/payouts:
    get:
      tags: [payouts]
      summary: List payouts
      operationId: listPayouts
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/CreatedAtSortField'
        - $ref: '#/components/parameters/PaymentStateFilter'
        - $ref: '#/components/parameters/PaymentKindFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
      responses:
        '200':
          description: Payout collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutListResponse'
              examples:
                default:
                  value:
                    data:
                      - payout_id: po_8831
                        reference_id: ref_pay_991
                        sourceAccountId: acct_treasury_1
                        destinationAccountId: acct_beneficiary_2
                        amount: '100.00'
                        asset:
                          chain: eip155:1
                          asset: usd_stable
                          decimals: 2
                        assetId: usd_stable
                        state: executing
                        reason_code: PAYMENT_PAYOUT_OK
                        user_op_hash: 0xaabbccddee
                        execution:
                          mode: erc4337
                          smart_account_id: sa_123
                          entry_point: 0xaabbccdd
                          sponsorship_mode: paymaster
                          sponsor_account_id: acct_treasury_1
                          sponsor_chain: eip155:1
                          sponsor_asset: usd_stable
                          allow_legacy_fallback: true
                        created_at: '2026-08-07T12:00:00.000Z'
                    pagination:
                      page: 1
                      page_size: 50
                      total_items: 1
                      total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/payouts/summary:
    get:
      tags: [payouts]
      summary: Get payout summary
      operationId: getPayoutSummary
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/PaymentStateFilter'
        - $ref: '#/components/parameters/FromCreatedAt'
        - $ref: '#/components/parameters/ToCreatedAt'
      responses:
        '200':
          description: Payout summary projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutSummary'
              examples:
                default:
                  value:
                    as_of: '2026-08-07T12:00:00.000Z'
                    total_count: 77
                    total_amount: '9050.00'
                    by_state:
                      created: 2
                      authorized: 3
                      executing: 7
                      settled: 63
                      failed: 2
                      reversed: 0
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/reconciliation/items:
    get:
      tags: [reconciliation]
      summary: List reconciliation items
      operationId: listReconciliationItems
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/ObservedAtSortField'
        - $ref: '#/components/parameters/ReconciliationStatusFilter'
        - $ref: '#/components/parameters/ReconciliationReasonCodeFilter'
      responses:
        '200':
          description: Reconciliation item collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationItemListResponse'
              examples:
                default:
                  value:
                    data:
                      - reconciliation_id: rec_1002
                        intent_id: pi_123
                        reference_id: ref_pay_991
                        intent_state: settled
                        settlement_state: settled
                        status: matched
                        reason_code: RECON_MATCHED
                        observed_at: '2026-08-07T12:05:00.000Z'
                        amount:
                          expected: '100.00'
                          observed: '100.00'
                        asset:
                          chain: eip155:1
                          asset: usd_stable
                          decimals: 2
                    pagination:
                      page: 1
                      page_size: 50
                      total_items: 1
                      total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/reconciliation/summary:
    get:
      tags: [reconciliation]
      summary: Get reconciliation summary
      operationId: getReconciliationSummary
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
      responses:
        '200':
          description: Reconciliation summary projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationSummary'
              examples:
                default:
                  value:
                    as_of: '2026-08-07T12:05:00.000Z'
                    total_items: 540
                    by_status:
                      matched: 530
                      mismatch: 8
                      pending: 2
                    mismatch_reason_codes:
                      RECON_AMOUNT_MISMATCH: 4
                      RECON_ASSET_MISMATCH: 3
                      RECON_STATE_MISMATCH: 1
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/overview:
    get:
      tags: [overview]
      summary: Get pay overview
      operationId: getPayOverview
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
      responses:
        '200':
          description: High-level pay overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayOverview'
              examples:
                default:
                  value:
                    as_of: '2026-08-07T12:05:00.000Z'
                    invoices:
                      total_count: 124
                      total_amount: '18203.15'
                      by_state:
                        created: 8
                        authorized: 4
                        executing: 3
                        settled: 105
                        failed: 4
                        reversed: 0
                    payouts:
                      total_count: 77
                      total_amount: '9050.00'
                      by_state:
                        created: 2
                        authorized: 3
                        executing: 7
                        settled: 63
                        failed: 2
                        reversed: 0
                    reconciliation:
                      total_items: 540
                      by_status:
                        matched: 530
                        mismatch: 8
                        pending: 2
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/subscriptions:
    get:
      tags: [overview]
      summary: Legacy subscriptions endpoint
      description: |
        Deprecated endpoint. Subscriptions are not part of the current Pay contract surface.
        Canonical behavior is `410 Gone`.
      deprecated: true
      operationId: getSubscriptions
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
      responses:
        '410':
          description: Subscriptions endpoint has been removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                deprecated:
                  value:
                    code: ENDPOINT_DEPRECATED
                    message: GET /pay/subscriptions is deprecated and no longer supported.
                    retryable: false
                    source: pay
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /pay/intents:
    post:
      tags: [intents]
      summary: Create pay intent
      description: Creates a canonical payment intent in `created` state.
      operationId: createIntent
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
            examples:
              payout:
                value:
                  reference_id: ref_pay_991
                  kind: payout
                  sourceAccountId: acct_treasury_1
                  destinationAccountId: acct_beneficiary_2
                  amount: '100.00'
                  asset:
                    chain: eip155:1
                    asset: usd_stable
                    decimals: 2
                  reason_code: PAYMENT_PAYOUT_OK
                  metadata:
                    payroll_batch_id: payroll_2026_08
                  execution:
                    mode: erc4337
                    smart_account_id: sa_123
                    entry_point: 0xaabbccdd
                    sponsorship_mode: paymaster
                    sponsor_account_id: acct_treasury_1
                    allow_legacy_fallback: true
      responses:
        '201':
          description: Intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '200':
          description: Idempotent replay of previously created intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          description: Idempotency conflict for identical `reference_id` and `idempotency-key` with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                conflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: idempotency conflict for reference_id and idempotency_key
                    retryable: false
                    source: pay
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/intents/{intentId}/transitions:
    post:
      tags: [intents]
      summary: Transition intent state
      description: Applies canonical lifecycle transition rules for a payment intent.
      operationId: transitionIntent
      parameters:
        - $ref: '#/components/parameters/IntentIdPath'
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionIntentRequest'
            examples:
              authorize:
                value:
                  to_state: authorized
              execute:
                value:
                  to_state: executing
              settle:
                value:
                  to_state: settled
      responses:
        '200':
          description: Transition applied (or replayed idempotently)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Invalid transition or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_transition:
                  value:
                    code: INVALID_TRANSITION
                    message: invalid payment state transition
                    retryable: false
                    source: pay
                conflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: idempotency conflict for reference_id and idempotency_key
                    retryable: false
                    source: pay
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pay/reconciliation/intents/{intentId}:
    post:
      tags: [reconciliation]
      summary: Reconcile intent against settlement snapshot
      operationId: reconcileIntent
      parameters:
        - $ref: '#/components/parameters/IntentIdPath'
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - $ref: '#/components/parameters/XPayApiVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileIntentRequest'
            examples:
              matched:
                value:
                  settlement:
                    reference_id: ref_pay_991
                    state: settled
                    amount: '100.00'
                    asset:
                      chain: eip155:1
                      asset: usd_stable
                      decimals: 2
                    observed_at: '2026-08-07T12:05:00.000Z'
      responses:
        '200':
          description: Reconciliation computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileIntentResponse'
              examples:
                matched:
                  value:
                    intent_id: pi_123
                    reference_id: ref_pay_991
                    status: matched
                    reason_code: RECON_MATCHED
                    observed_at: '2026-08-07T12:05:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '429':
          $ref: '#/components/responses/RateLimitedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token-based HTTP authentication via the Authorization header.

  parameters:
    XRequestIdHeader:
      name: x-request-id
      in: header
      required: false
      description: Caller request identifier for traceability.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XCorrelationIdHeader:
      name: x-correlation-id
      in: header
      required: false
      description: Cross-service correlation identifier.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    XPayApiVersionHeader:
      name: x-pay-api-version
      in: header
      required: false
      description: Requested Pay API version; if omitted, service default follows `PAY_API_VERSION`.
      schema:
        type: string
        default: 1.0.0
    IdempotencyKeyHeader:
      name: idempotency-key
      in: header
      required: true
      description: Required on write/transition endpoints for replay-safe mutation semantics.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IntentIdPath:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        minLength: 3
      description: Canonical payment intent identifier.
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SortOrder:
      name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      description: Sort order for list endpoints.
    CreatedAtSortField:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum: [created_at, amount, state]
        default: created_at
      description: Sort field for invoice/payout collections.
    ObservedAtSortField:
      name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum: [observed_at, status, reason_code]
        default: observed_at
      description: Sort field for reconciliation item collections.
    PaymentStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentIntentState'
      description: Filter by canonical payment lifecycle state.
    PaymentKindFilter:
      name: kind
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentKind'
      description: Filter by intent kind.
    ReconciliationStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ReconciliationStatus'
      description: Filter reconciliation items by status.
    ReconciliationReasonCodeFilter:
      name: reason_code
      in: query
      required: false
      schema:
        type: string
        pattern: '^[A-Z0-9_]+'
      description: Filter reconciliation items by reason code.
    FromCreatedAt:
      name: created_from
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive start timestamp for created-at filtering.
    ToCreatedAt:
      name: created_to
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: Inclusive end timestamp for created-at filtering.

  responses:
    BadRequestError:
      description: Invalid request parameters or payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: VALIDATION_ERROR
                message: request payload validation failed
                retryable: false
                source: pay
    UnauthorizedError:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: UNAUTHORIZED
                message: missing or invalid authorization token
                retryable: false
                source: pay
    ForbiddenError:
      description: Authenticated principal lacks permission for this operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: FORBIDDEN
                message: caller is not authorized to access this resource
                retryable: false
                source: pay
    NotFoundError:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: NOT_FOUND
                message: requested resource not found
                retryable: false
                source: pay
    ConflictError:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: CONFLICT
                message: resource conflict
                retryable: false
                source: pay
    RateLimitedError:
      description: Caller exceeded configured rate limits.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: RATE_LIMITED
                message: too many requests
                retryable: true
                source: pay
    InternalServerError:
      description: Unhandled service error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            default:
              value:
                code: INTERNAL_ERROR
                message: internal server error
                retryable: true
                source: internal

  schemas:
    PaymentKind:
      type: string
      enum: [payout, collection, treasury_transfer]
    PaymentExecutionMode:
      type: string
      enum: [legacy, erc4337]
    SponsorshipMode:
      type: string
      enum: [none, paymaster]
    PaymentIntentState:
      type: string
      enum: [created, authorized, executing, settled, failed, reversed]
    ReconciliationStatus:
      type: string
      enum: [matched, mismatch, pending]
    SettlementState:
      type: string
      enum: [pending, settled, failed]

    ErrorResponse:
      type: object
      required: [code, message, retryable, source]
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]+'
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error summary.
        retryable:
          type: boolean
          description: Indicates whether caller may safely retry.
        source:
          type: string
          enum: [pay, policy-risk, ledger-settlement, accounts, asset-registry, internal]
          description: System/source that produced the failure.
        details:
          type: object
          additionalProperties: true
          description: Optional structured metadata.

    UnifiedAssetReference:
      type: object
      required: [chain, asset, decimals]
      properties:
        chain:
          type: string
          pattern: '^[a-z0-9]+:[a-z0-9._-]+$'
        asset:
          type: string
          pattern: '^[a-z0-9._-]+$'
        decimals:
          type: integer
          minimum: 0
          maximum: 38

    PaymentExecution:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/PaymentExecutionMode'
        smart_account_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[a-zA-Z0-9:_-]+$'
        entry_point:
          type: string
          pattern: '^0x[a-f0-9]{4,}$'
        sponsorship_mode:
          $ref: '#/components/schemas/SponsorshipMode'
        sponsor_account_id:
          type: string
          minLength: 3
          maxLength: 128
          pattern: '^[a-zA-Z0-9:_-]+$'
        sponsor_chain:
          type: string
        sponsor_asset:
          type: string
        allow_legacy_fallback:
          type: boolean
      allOf:
        - if:
            properties:
              mode:
                const: legacy
          then:
            not:
              anyOf:
                - required: [smart_account_id]
                - required: [entry_point]
                - required: [sponsorship_mode]
                - required: [sponsor_account_id]
                - required: [sponsor_chain]
                - required: [sponsor_asset]
        - if:
            properties:
              mode:
                const: erc4337
          then:
            required: [smart_account_id, entry_point]

    PaymentIntent:
      type: object
      required:
        - intent_id
        - reference_id
        - idempotency_key
        - kind
        - sourceAccountId
        - destinationAccountId
        - amount
        - asset
        - assetId
        - reason_code
        - state
        - created_at
      properties:
        intent_id:
          type: string
        reference_id:
          type: string
        idempotency_key:
          type: string
        kind:
          $ref: '#/components/schemas/PaymentKind'
        sourceAccountId:
          type: string
        destinationAccountId:
          type: string
        amount:
          type: string
          pattern: '^-?[0-9]+(\\.[0-9]{1,18})?$'
        asset:
          $ref: '#/components/schemas/UnifiedAssetReference'
        assetId:
          type: string
        reason_code:
          type: string
        reason_codes:
          type: array
          items:
            type: string
        user_op_hash:
          type: string
          pattern: '^0x[a-f0-9]{8,}$'
        execution:
          $ref: '#/components/schemas/PaymentExecution'
        metadata:
          type: object
          additionalProperties:
            type: string
        state:
          $ref: '#/components/schemas/PaymentIntentState'
        created_at:
          type: string
          format: date-time

